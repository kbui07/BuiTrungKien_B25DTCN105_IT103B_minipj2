<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let price = [100, 200, 300, 400];
        console.log("Giá trị của từng phần tử trong mảng: ");
        for (let element of price) {
            console.log(element);
        }
        console.log("Vị trí của từng phần tử trong mảng: ");
        for (let index in price) {
            console.log(index);
        }
        let sumIndex = 0;
        for (let i = 0; i < price.length; i++) {
            if (i % 2 === 0) {
                sumIndex += price[i];
            }
        }
        console.log("Tổng các phần tử ở index chẵn:", sumIndex);
    </script>
</body>
</html>

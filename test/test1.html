<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let students = ["Quý", "Nam", "Lan", "Hung", "Nam"];
        let reverseStudents = students.slice().reverse();
        console.log("Danh sách sinh viên sau khi đảo ngược:", reverseStudents);
        flag = false;
        for (let i= 0; i < students.length; i++) {
            if (students[i] === "Lan") {
                flag = true;
                break;
            }
        }
        if (flag) {
            console.log("Tên Lan tồn tại trong mảng");
        } else {
            console.log("Tên Lan không tồn tại trong mảng");
        }
        let index = students.indexOf("Nam");
        console.log("Vị trí của tên Nam trong mảng:", index);
    </script>
</body>
</html>
